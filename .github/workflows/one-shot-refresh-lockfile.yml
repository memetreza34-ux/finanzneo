name: One-shot apply verified lockfile fix

on:
  push:
    branches:
      - reel/test-free-visual-form-1pct-fees

permissions:
  contents: write

jobs:
  apply-lockfile-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reel/test-free-visual-form-1pct-fees

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply compatible security fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify reproducible install and security audit
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Commit verified lockfile fix
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          FINANZNEO_ALLOW_PROTECTED_CHANGES=1 git commit -m "chore(deps): refresh patched transitive dependencies"
          git push origin HEAD:reel/test-free-visual-form-1pct-fees
