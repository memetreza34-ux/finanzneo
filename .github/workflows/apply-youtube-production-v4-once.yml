name: Apply YouTube Production V4 Once

on:
  push:
    branches:
      - reel/test-free-visual-form-1pct-fees
    paths:
      - .github/workflows/apply-youtube-production-v4-once.yml

permissions:
  contents: write

jobs:
  migrate-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reel/test-free-visual-form-1pct-fees
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply YouTube V4 migration
        run: node scripts/tmp-upgrade-youtube-production-v4.mjs
      - name: Apply compatibility markers
        run: node scripts/tmp-fix-youtube-v4-compat.mjs
      - name: Keep legacy Reel tooling intact
        run: node scripts/tmp-keep-legacy-reel-tooling.mjs
      - name: Scaffold YouTube V4 contract test
        run: |
          node scripts/scaffold-finanzneo-youtube.mjs --target youtube/__ci_youtube_v4 --title "CI YouTube V4" --types image,animation,image,hybrid,image,animation,image
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const path = 'youtube/__ci_youtube_v4/04-visuals/visual-index.json';
          const index = JSON.parse(readFileSync(path, 'utf8'));
          let motionIndex = 0;
          for (const visual of index.visuals) {
            if (!['animation','hybrid','data'].includes(visual.type)) continue;
            motionIndex += 1;
            visual.viewerChange = `viewer-change-${motionIndex}`;
            visual.animationIntent = `intent-${motionIndex}`;
            visual.mechanicId = `mechanic-${motionIndex}`;
            visual.visualTechniqueId = `technique-${motionIndex}`;
            visual.techniqueDescription = `distinct technique ${motionIndex}`;
            visual.compositionFamilyId = `family-${motionIndex}`;
            visual.toolStack = [`tool-${motionIndex}`];
            visual.motionSignature = {camera:`camera-${motionIndex}`,layout:`layout-${motionIndex}`,transformation:`transform-${motionIndex}`};
            visual.motionChannels = [`channel-a-${motionIndex}`,`channel-b-${motionIndex}`];
            visual.visualBeats = [`start-${motionIndex}`,`result-${motionIndex}`];
          }
          writeFileSync(path, JSON.stringify(index, null, 2) + '\n');
          NODE
      - name: Validate generated YouTube V4 project
        run: npm run youtube:validate -- youtube/__ci_youtube_v4
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Remove CI test project
        if: always()
        run: rm -rf youtube/__ci_youtube_v4
      - name: Commit reviewed migration
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md package.json youtube config scripts tests
          git diff --cached --quiet || FINANZNEO_ALLOW_PROTECTED_CHANGES=1 git commit -m "Shift active production to YouTube Longform V4"
          git push origin HEAD:reel/test-free-visual-form-1pct-fees
