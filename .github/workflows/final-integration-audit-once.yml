name: Final Integration Audit Once

on:
  push:
    branches:
      - reel/notgroschen-test-v1
    paths:
      - '.github/workflows/final-integration-audit-once.yml'

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: reel/notgroschen-test-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply conflict-safe migration
        run: node scripts/tmp-final-integration-audit.mjs

      - name: Install dependencies
        run: npm ci

      - name: Full repository validation
        run: npm run validate

      - name: Validate current Reel contract
        run: npm run reel:validate -- reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke test
        run: npm run smoke

      - name: Final integration assertions
        run: |
          test -f reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/04-caption/caption.txt
          test -f reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/04-caption/word-timings.json
          test ! -e reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/04-caption/instagram-reels.txt
          test ! -e reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/04-caption/tiktok.txt
          test ! -e reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/04-caption/facebook-reels.txt
          test ! -e reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/04-caption/snapchat.txt
          ! grep -q "caption-instagram.txt\|caption-tiktok.txt\|caption-facebook.txt\|caption-snapchat.txt" scripts/export-reel.mjs
          grep -q '"reel:export": "node scripts/export-reel.mjs"' package.json
          grep -q 'Playwright Visual QA' reels/PRODUKTIONSSTANDARD.md
          grep -q 'keine separaten Plattform-Captiondateien' docs/PLATFORM-PUBLISHING.md

      - name: Remove one-time helpers
        run: |
          rm -f scripts/tmp-final-integration-audit.mjs
          rm -f .github/workflows/final-integration-audit-once.yml

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Integrate motion stack and publishing contracts safely"
          git push origin HEAD:reel/notgroschen-test-v1
