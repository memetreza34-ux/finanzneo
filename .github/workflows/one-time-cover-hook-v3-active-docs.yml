name: One-time activate Cover Hook V3

on:
  push:
    branches:
      - repo/future-cover-hook-v3-content-first

permissions:
  contents: write

jobs:
  activate-cover-hook-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch active docs
        run: node scripts/.tmp-apply-cover-hook-v3-active-docs.mjs

      - name: Remove one-time migration helpers
        run: |
          rm scripts/.tmp-apply-cover-hook-v3-active-docs.mjs
          rm .github/workflows/one-time-cover-hook-v3-active-docs.yml

      - name: Regression guard
        run: npm run reel:regression:check

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke
        run: npm run smoke

      - name: Commit validated V3 standard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          FINANZNEO_ALLOW_PROTECTED_CHANGES=1 git commit -m "Activate content-first cover hook V3"

      - name: Hard changed-path gate
        run: |
          git fetch origin main
          allowed='^(CLAUDE\.md|ANLEITUNG\.md|MASTER-PROMPTS\.md|START-HIER\.md|reels/PRODUKTIONSSTANDARD\.md|docs/FUTURE-COVER-HOOK-V3\.md|docs/FUTURE-REEL-PRODUCTION-V3\.md|docs/PHASE-1-BRIEFING\.md|docs/3-PHASEN-WORKFLOW\.md|docs/SCENE-INDEX-SCHEMA\.md|\.agents/skills/finanzneo-reel/SKILL\.md|\.agents/workflows/build-finanzneo-reel\.md|scripts/apply-future-cover-hook-v3\.mjs|scripts/validate-future-cover-hook-v3\.mjs|scripts/validate-future-cover-hook-v2\.mjs|scripts/create-finanzneo-reel\.mjs|scripts/validate-reel\.mjs|scripts/validate-active-reel-rules\.mjs|tests/cover-hook-v3\.test\.ts)$'
          bad=$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected paths in final diff:"
            echo "$bad"
            exit 1
          fi

      - name: Final regression guard
        run: npm run reel:regression:check

      - name: Push final checked commit
        run: git push origin HEAD:repo/future-cover-hook-v3-content-first
