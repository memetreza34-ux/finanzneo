name: One-time Thursday Remotion freedom upgrade

on:
  push:
    branches:
      - repo/reel-2026-09-03-kreditkarten-teilzahlung
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: repo/reel-2026-09-03-kreditkarten-teilzahlung
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bestehende Reels vor Änderung schützen
        run: node scripts/check-reel-regression-baseline.mjs

      - name: Upgrade-Skripte syntaktisch prüfen
        run: |
          node --check scripts/.tmp-normalize-phase1-patcher-input.mjs
          node --check scripts/.tmp-upgrade-cover-remotion-freedom.mjs
          node --check scripts/.tmp-postpatch-cover-handoff.mjs
          node --check scripts/.tmp-postpatch-static-timing.mjs

      - name: Phase-1-Template für Patch normalisieren
        run: node scripts/.tmp-normalize-phase1-patcher-input.mjs

      - name: Cover und Remotion-Freedom anwenden
        run: node scripts/.tmp-upgrade-cover-remotion-freedom.mjs

      - name: Cover-Handoff technisch ausrichten
        run: node scripts/.tmp-postpatch-cover-handoff.mjs

      - name: Statische V3-Timings ausrichten
        run: node scripts/.tmp-postpatch-static-timing.mjs

      - name: Temporäre Patcher vor Lint entfernen
        run: |
          rm scripts/.tmp-normalize-phase1-patcher-input.mjs
          rm scripts/.tmp-upgrade-cover-remotion-freedom.mjs
          rm scripts/.tmp-postpatch-cover-handoff.mjs
          rm scripts/.tmp-postpatch-static-timing.mjs

      - name: Regression Guard nach Änderung
        run: node scripts/check-reel-regression-baseline.mjs

      - name: Reel-spezifische Cover-Prüfung
        run: node scripts/validate-future-cover-hook-v2.mjs reels/2026-08-31_bis_2026-09-06/donnerstag/reel-04_kreditkarten-teilzahlung

      - name: Reel-spezifische Visual-Beats prüfen
        run: node scripts/validate-visual-beat-contract.mjs reels/2026-08-31_bis_2026-09-06/donnerstag/reel-04_kreditkarten-teilzahlung

      - name: Freie Remotion-Animationen prüfen
        run: node scripts/validate-animation-source-quality.mjs reels/2026-08-31_bis_2026-09-06/donnerstag/reel-04_kreditkarten-teilzahlung

      - name: Future-V3-Vertrag prüfen
        run: node scripts/validate-future-production-standard-v3.mjs reels/2026-08-31_bis_2026-09-06/donnerstag/reel-04_kreditkarten-teilzahlung

      - name: Scene-01-Cover-/Export-Vertrag prüfen
        run: node scripts/validate-scene01-cover-export-contract.mjs reels/2026-08-31_bis_2026-09-06/donnerstag/reel-04_kreditkarten-teilzahlung

      - name: Vollständige Validatoren
        run: npm run validate

      - name: Remotion Bundle
        run: npm run build

      - name: Render Smoke
        run: npm run smoke

      - name: Temporären Workflow entfernen
        run: rm .github/workflows/one-time-upgrade-thursday-remotion.yml

      - name: Geänderte Pfade hart begrenzen
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          bad=0
          while IFS= read -r path; do
            case "$path" in
              reels/2026-08-31_bis_2026-09-06/donnerstag/reel-04_kreditkarten-teilzahlung/*|scripts/lib/premium-animation-contract.mjs|scripts/apply-premium-animation-v2.mjs|scripts/apply-phase1-animation-code-contract.mjs|scripts/validate-animation-source-quality.mjs|scripts/apply-future-cover-hook-v2.mjs|scripts/validate-future-cover-hook-v2.mjs|scripts/validate-visual-beat-contract.mjs|tests/animation-source-quality.test.ts|src/design-system/README.md|scripts/.tmp-upgrade-cover-remotion-freedom.mjs|scripts/.tmp-normalize-phase1-patcher-input.mjs|scripts/.tmp-postpatch-cover-handoff.mjs|scripts/.tmp-postpatch-static-timing.mjs|.github/workflows/one-time-upgrade-thursday-remotion.yml)
                ;;
              *)
                echo "Unerwarteter geänderter Pfad: $path"
                bad=1
                ;;
            esac
          done < <(git diff --cached --name-only)
          test "$bad" -eq 0

      - name: Finalen Regression Guard ausführen
        run: node scripts/check-reel-regression-baseline.mjs

      - name: Geprüfte Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FINANZNEO_ALLOW_PROTECTED_CHANGES=1 git commit -m "Use 3-frame cover and expand Remotion animation freedom"
          git push origin HEAD:repo/reel-2026-09-03-kreditkarten-teilzahlung
