name: Apply Cinematic Animation Standard Once

on:
  push:
    branches:
      - reel/notgroschen-test-v1
    paths:
      - '.github/workflows/apply-cinematic-standard-current-reel-once.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reel branch
        uses: actions/checkout@v4
        with:
          ref: reel/notgroschen-test-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply cinematic contract to current Reel
        run: |
          TARGET='reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen'
          node scripts/apply-phase1-animation-code-contract.mjs "$TARGET"
          node scripts/apply-premium-animation-v2.mjs "$TARGET"
          node scripts/tmp-align-cinematic-standard.mjs

      - name: Validate current Reel
        run: npm run reel:validate -- reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen

      - name: Commit migration and cleanup bootstrap
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          rm .github/workflows/apply-cinematic-standard-current-reel-once.yml
          rm scripts/tmp-align-cinematic-standard.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
          else
            git commit -m 'Lock cinematic animations and header consistency'
            git push origin HEAD:reel/notgroschen-test-v1
          fi
