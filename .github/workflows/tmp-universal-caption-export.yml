name: Universal Caption Export Once

on:
  push:
    branches:
      - reel/notgroschen-test-v1
    paths:
      - .github/workflows/tmp-universal-caption-export.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel/notgroschen-test-v1
          fetch-depth: 0

      - name: Keep one caption for all social reel platforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/export-reel.mjs')
          s = p.read_text()

          old = """// ── 4. Captions ─────────────────────────────────────────────────────────────
// caption-universal.txt ist die primäre Caption für ALLE Reel-Plattformen.
// Plattformvarianten bleiben als zusätzliche Dateien erhalten, falls später
// doch eine plattformspezifische Anpassung gebraucht wird.
const captionQuellen = {
  'caption-universal.txt': '04-caption/caption.txt',
  'caption-instagram.txt': '04-caption/instagram-reels.txt',
  'caption-tiktok.txt': '04-caption/tiktok.txt',
  'caption-facebook.txt': '04-caption/facebook-reels.txt',
  'caption-snapchat.txt': '04-caption/snapchat.txt',
};
for (const [ziel, quelle] of Object.entries(captionQuellen)) {
  const q = resolve(root, quelle);
  if (existsSync(q)) {
    copyFileSync(q, join(exportDir, ziel));
    gebaut.push(ziel);
  } else {
    fehlt.push(quelle);
  }
}
"""
          new = """// ── 4. Caption ──────────────────────────────────────────────────────────────
// Genau EINE universelle Caption wird für alle Reel-Plattformen exportiert.
// Keine separaten Instagram-/TikTok-/Facebook-/Snapchat-Captiondateien.
const captionQuelle = resolve(root, '04-caption/caption.txt');
if (existsSync(captionQuelle)) {
  copyFileSync(captionQuelle, join(exportDir, 'caption-universal.txt'));
  gebaut.push('caption-universal.txt');
} else {
  fehlt.push('04-caption/caption.txt');
}
"""
          if old not in s:
              raise SystemExit('caption export block not found')
          s = s.replace(old, new)

          old2 = """Die zusätzlichen Plattformdateien bleiben nur als optionale Varianten im Paket.

## Cover
"""
          new2 = """Es werden bewusst keine separaten Plattform-Captiondateien erzeugt.

## Cover
"""
          if old2 not in s:
              raise SystemExit('upload caption note not found')
          s = s.replace(old2, new2)

          old3 = """- `bilder.zip` — alle Szenenbilder, falls du einzelne nachnutzen willst
- `untertitel.srt` — separate Untertiteldatei
- optionale Plattform-Captions für spätere Sonderanpassungen
"""
          new3 = """- `bilder.zip` — alle Szenenbilder, falls du einzelne nachnutzen willst
- `untertitel.srt` — separate Untertiteldatei
- `caption-universal.txt` — die einzige Caption für alle Reel-Plattformen
"""
          if old3 not in s:
              raise SystemExit('upload further-files block not found')
          s = s.replace(old3, new3)
          p.write_text(s)

          readme = Path('reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen/06-export/README.md')
          readme.write_text('''# 06-export — automatischer finaler Reel-Export\n\nDieser Ordner ist der einzige finale Ausgabeordner. Nach bestandener Phase-3-Render-QA startet der Render-Prozess automatisch den Export.\n\n## Pflichtdateien nach erfolgreichem Abschluss\n\n- `reel-02_notgroschen-richtig-aufbauen.mp4` — fertiges, per Render-QA geprüftes Reel\n- `caption-universal.txt` — **die einzige Caption** für Instagram Reels, TikTok, Facebook Reels und Snapchat\n- `cover.png` / entsprechendes Bildformat — exakt das Bild aus scene-01\n- `untertitel.srt`\n- `UPLOAD.md`\n- `bilder.zip`\n\nEs werden **keine separaten Caption-Dateien pro Plattform** erzeugt. Du kopierst denselben Text aus `caption-universal.txt` auf jede Social-Media-Plattform, auf der das Reel veröffentlicht wird.\n''')

          export_dir = readme.parent
          for name in ['caption-instagram.txt','caption-tiktok.txt','caption-facebook.txt','caption-snapchat.txt']:
              f = export_dir / name
              if f.exists():
                  f.unlink()
          PY

          rm .github/workflows/tmp-universal-caption-export.yml

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "memetreza34-ux"
          git config user.email "memetreza34@gmail.com"
          git add -A
          git commit -m "Use one universal caption for all reel platforms"
          git push origin HEAD:reel/notgroschen-test-v1
