name: Apply Scene01 Cover Contract Once

on:
  push:
    branches:
      - reel/notgroschen-test-v1
    paths:
      - '.github/workflows/apply-scene01-current-reel.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reel-Branch
        uses: actions/checkout@v4
        with:
          ref: reel/notgroschen-test-v1
          fetch-depth: 0

      - name: Apply new cover/export contract
        run: |
          node scripts/apply-scene01-cover-export-contract.mjs reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen

      - name: Remove one-time workflow and commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-scene01-current-reel.yml
          git add reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen
          git commit -m "Apply scene 01 cover and automatic export contract"
          git push origin HEAD:reel/notgroschen-test-v1
