name: Finalize Notgroschen Phase 1

on:
  push:
    branches:
      - youtube/notgroschen-video-01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-notgroschen-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[phase1-seal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: youtube/notgroschen-video-01
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: YouTube-Projektvertrag validieren
        run: npm run youtube:validate -- youtube/video-01_notgroschen

      - name: Motion-V3-Qualität validieren
        run: npm run youtube:animation:validate -- youtube/video-01_notgroschen

      - name: Phase-1-Motion versiegeln
        run: npm run youtube:phase1:seal -- youtube/video-01_notgroschen

      - name: Seal in Phase-1-Branch committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube/video-01_notgroschen/06-projektdateien/animation-seal.json
          if git diff --cached --quiet; then
            echo "Seal ist bereits aktuell."
            exit 0
          fi
          git commit -m "Seal Notgroschen Phase 1 [phase1-seal]"
          git push origin HEAD:youtube/notgroschen-video-01
