name: FinanzNeo Validate

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
      - 'fix/**'
      - 'repo/**'
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'repo/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup und Lockfile vorab prüfen
        run: node scripts/check-setup.mjs

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Abhängigkeiten auf Sicherheitslücken prüfen
        run: npm audit --audit-level=high

      - name: Validatoren und TypeScript ausführen
        run: npm run validate

      - name: Remotion-Bundle erstellen
        run: npm run build

      - name: Render-Smoke-Test ausführen
        run: npm run smoke
