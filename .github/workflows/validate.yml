name: FinanzNeo Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: finanzneo-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bestehende Reel-Produktionen gegen Regression schützen
        run: node scripts/check-reel-regression-baseline.mjs

      - name: Setup und Lockfile vorab prüfen
        run: node scripts/check-setup.mjs

      - name: FFmpeg und ffprobe sicherstellen
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Abhängigkeiten auf Sicherheitslücken prüfen
        run: npm audit --audit-level=high

      - name: Validatoren und TypeScript ausführen
        run: npm run validate

      - name: Remotion-Bundle erstellen
        run: npm run build

      - name: YouTube-Finanz-Motion-Lab rendern
        run: npm run youtube:motion:lab:smoke

      - name: YouTube-System vor Produktionsstart prüfen
        run: npm run youtube:system:ready

      - name: Gehaltserhöhungs-Testvideo Phase 1 validieren
        run: npm run youtube:animation:validate -- youtube/warum-du-trotz-gehaltserhoehung-nicht-mehr-geld-hast-hybrid

      - name: Gehaltserhöhungs-Testvideo Phase 1 versiegeln
        shell: bash
        run: |
          npm run youtube:phase1:seal -- youtube/warum-du-trotz-gehaltserhoehung-nicht-mehr-geld-hast-hybrid
          cat youtube/warum-du-trotz-gehaltserhoehung-nicht-mehr-geld-hast-hybrid/06-projektdateien/animation-seal.json
          git diff --exit-code -- youtube/warum-du-trotz-gehaltserhoehung-nicht-mehr-geld-hast-hybrid/06-projektdateien/animation-seal.json

      - name: Render-Smoke-Test ausführen
        run: npm run smoke
