name: One-time create Saturday Tagesgeld reel

on:
  push:
    branches:
      - repo/reel-2026-09-05-tagesgeld-aktionszins

permissions:
  contents: write

jobs:
  create-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generator syntax
        run: |
          node --check scripts/.tmp-create-saturday-tagesgeld.mjs
          node --check scripts/.tmp-fix-saturday-source-contract.mjs
          node --check scripts/.tmp-compact-saturday-prompts.mjs
          node --check scripts/.tmp-fix-saturday-animation.mjs

      - name: Regression before
        run: npm run reel:regression:check

      - name: Create official reel scaffold
        run: |
          npm run reel:create -- \
            --target reels/2026-08-31_bis_2026-09-06/samstag/reel-06_tagesgeld-aktionszins \
            --title "3 % Tagesgeld? Prüfe, wie lange der Zins wirklich gilt" \
            --types image,animation,image,animation,image,animation,image,animation,image,animation,image,image,animation,image

      - name: Fill production-ready Phase 1
        run: node scripts/.tmp-create-saturday-tagesgeld.mjs

      - name: Align exact source-contract markers
        run: node scripts/.tmp-fix-saturday-source-contract.mjs

      - name: Compact V9 image prompts
        run: node scripts/.tmp-compact-saturday-prompts.mjs

      - name: Reapply strict Flow single-job contract
        run: node scripts/apply-flow-autonomous-contract.mjs reels/2026-08-31_bis_2026-09-06/samstag/reel-06_tagesgeld-aktionszins

      - name: Make scene-06 ring deterministic
        run: node scripts/.tmp-fix-saturday-animation.mjs

      - name: Remove one-time helpers before validation
        run: |
          rm scripts/.tmp-create-saturday-tagesgeld.mjs
          rm scripts/.tmp-fix-saturday-source-contract.mjs
          rm scripts/.tmp-compact-saturday-prompts.mjs
          rm scripts/.tmp-fix-saturday-animation.mjs
          rm .github/workflows/one-time-create-saturday-tagesgeld.yml

      - name: Regression after
        run: npm run reel:regression:check

      - name: Reel contract validation
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/samstag/reel-06_tagesgeld-aktionszins

      - name: Animation source quality
        run: npm run reel:animation:validate -- reels/2026-08-31_bis_2026-09-06/samstag/reel-06_tagesgeld-aktionszins

      - name: Literal-first Image Storytelling V3
        run: node scripts/validate-future-image-storytelling-v3.mjs reels/2026-08-31_bis_2026-09-06/samstag/reel-06_tagesgeld-aktionszins

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke
        run: npm run smoke

      - name: Commit generated reel and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create Saturday Tagesgeld promotional-rate reel"

      - name: Hard changed-path gate
        run: |
          git fetch origin main
          bad=$(git diff --name-only origin/main...HEAD | grep -v '^reels/2026-08-31_bis_2026-09-06/samstag/reel-06_tagesgeld-aktionszins/' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected paths in final diff:"
            echo "$bad"
            exit 1
          fi

      - name: Final regression guard
        run: npm run reel:regression:check

      - name: Push final checked commit
        run: git push origin HEAD:repo/reel-2026-09-05-tagesgeld-aktionszins
