name: One-time fast-uri lockfile fix

on:
  push:
    branches:
      - repo/regression-guard-working-reels
    paths:
      - .github/workflows/one-time-fast-uri-lockfile-fix.yml

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: repo/regression-guard-working-reels

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regression-Baseline vor Änderung prüfen
        run: node scripts/check-reel-regression-baseline.mjs

      - name: Nur fast-uri 3.1.6 im Lockfile patchen
        shell: bash
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const key = 'node_modules/fast-uri';
          const current = lock.packages?.[key];
          if (!current) {
            throw new Error(`${key} fehlt im Lockfile.`);
          }
          if (current.version !== '3.1.5') {
            throw new Error(`Unerwartete Ausgangsversion von fast-uri: ${current.version}`);
          }

          const dist = JSON.parse(
            execFileSync('npm', ['view', 'fast-uri@3.1.6', 'dist', '--json'], {encoding: 'utf8'}),
          );
          if (!dist?.tarball || !dist?.integrity) {
            throw new Error('npm lieferte keine vollständigen Dist-Metadaten für fast-uri@3.1.6.');
          }

          lock.packages[key] = {
            ...current,
            version: '3.1.6',
            resolved: dist.tarball,
            integrity: dist.integrity,
          };
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          console.log(`fast-uri: ${current.version} -> ${lock.packages[key].version}`);
          NODE

      - name: Beweisen, dass semantisch nur fast-uri geändert wurde
        shell: bash
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');

          const before = JSON.parse(
            execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}),
          );
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          const beforePackages = before.packages ?? {};
          const afterPackages = after.packages ?? {};
          const keys = [...new Set([...Object.keys(beforePackages), ...Object.keys(afterPackages)])].sort();
          const changedPackages = keys.filter(
            (key) => JSON.stringify(beforePackages[key]) !== JSON.stringify(afterPackages[key]),
          );

          if (JSON.stringify(changedPackages) !== JSON.stringify(['node_modules/fast-uri'])) {
            console.error('Unerwartete Lockfile-Paketänderungen:', changedPackages);
            process.exit(1);
          }

          const fastUri = afterPackages['node_modules/fast-uri'];
          if (fastUri?.version !== '3.1.6') {
            console.error('fast-uri wurde nicht exakt auf 3.1.6 aktualisiert:', fastUri?.version);
            process.exit(1);
          }

          const withoutPackages = ({packages, ...rest}) => rest;
          if (JSON.stringify(withoutPackages(before)) !== JSON.stringify(withoutPackages(after))) {
            console.error('Unerwartete Top-Level-Änderung in package-lock.json.');
            process.exit(1);
          }

          console.log('OK: Semantisch wurde ausschließlich node_modules/fast-uri auf 3.1.6 geändert.');
          NODE

      - name: Setup und Lockfile prüfen
        run: node scripts/check-setup.mjs

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Security-Audit prüfen
        run: npm audit --audit-level=high

      - name: Vollständige Validatoren ausführen
        run: npm run validate

      - name: Remotion-Bundle erstellen
        run: npm run build

      - name: Render-Smoke-Test ausführen
        run: npm run smoke

      - name: Regression-Baseline nach allen Prüfungen erneut prüfen
        run: node scripts/check-reel-regression-baseline.mjs

      - name: Einmaligen Workflow entfernen
        run: rm .github/workflows/one-time-fast-uri-lockfile-fix.yml

      - name: Minimalen Security-Fix committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-time-fast-uri-lockfile-fix.yml
          CHANGED="$(git diff --cached --name-only)"
          printf '%s\n' "$CHANGED"
          if [ "$CHANGED" != $'.github/workflows/one-time-fast-uri-lockfile-fix.yml\npackage-lock.json' ]; then
            echo "Unerwartete Dateien im Commit. Abbruch."
            exit 1
          fi
          FINANZNEO_ALLOW_PROTECTED_CHANGES=1 git commit -m "Fix fast-uri audit finding"
          git push origin HEAD:repo/regression-guard-working-reels
