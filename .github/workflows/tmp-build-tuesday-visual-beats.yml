name: Build Tuesday Visual Beats Once

on:
  push:
    branches:
      - reel/visual-beats-tuesday-2026w36
    paths:
      - '.github/workflows/tmp-build-tuesday-visual-beats.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: reel/visual-beats-tuesday-2026w36
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build global visual-beat rules and Tuesday reel
        run: node scripts/tmp-build-tuesday-visual-beats.mjs

      - name: Normalize Tuesday Flow contract markers
        run: node scripts/tmp-fix-tuesday-flow-master.mjs

      - name: Prove backward compatibility on Monday reel
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld

      - name: Validate Tuesday reel including visual beats
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus

      - name: Assert Tuesday pacing and user ownership
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus/03-szenen/scene-index.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (x.visualBeatContract?.id !== 'finanzneo-visual-beats-v1') throw new Error('Visual beat contract missing');
          if (x.sceneCount !== 13 || x.imageSceneCount !== 9 || x.animationSceneCount !== 4) throw new Error('Unexpected scene mix');
          const beats = x.scenes.reduce((sum,s)=>sum+(s.visualBeats?.length||0),0);
          if (beats < 20) throw new Error('Too few visual beats: '+beats);
          for (const s of x.scenes.filter(s=>s.type==='image')) {
            if (s.plannedDurationSeconds > 4.5) throw new Error(s.id+' image beat too long');
          }
          console.log('✓ Tuesday pacing:', x.sceneCount, 'scenes,', beats, 'visual beats, 9 images / 4 animations');
          NODE
          test -f reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus/02-audio/README.md
          test ! -e reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus/02-audio/voiceover.mp3
          test ! -e reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus/02-audio/voiceover.wav
          test ! -e reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus/03-szenen/00-ALLE-BILDER-HIER-REIN/'Bild 01 - Konto im Minus.png'

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke test
        run: npm run smoke

      - name: Remove one-time helpers
        run: |
          rm -f scripts/tmp-build-tuesday-visual-beats.mjs
          rm -f scripts/tmp-fix-tuesday-flow-master.mjs
          rm -f .github/workflows/tmp-build-tuesday-visual-beats.yml

      - name: Commit only after every guard passed
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add visual beat pacing and Tuesday overdraft reel"
          git push origin HEAD:reel/visual-beats-tuesday-2026w36
