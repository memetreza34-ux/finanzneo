# one-shot rerun after reviewed protected-file changes
name: Apply Cover Parallel V2 Once

on:
  push:
    branches:
      - reel/test-free-visual-form-1pct-fees
    paths:
      - .github/workflows/apply-cover-parallel-v2-once.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reel/test-free-visual-form-1pct-fees
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Update highest project rule
        run: node scripts/tmp-apply-cover-parallel-v2.mjs
      - name: Update source contract for cover parallelism
        run: node scripts/tmp-fix-source-contract-cover-parallel.mjs
      - name: Shorten cover workflow header
        run: node scripts/tmp-shorten-cover-parallel-header.mjs
      - name: Apply Flow contract to current test reel
        run: node scripts/apply-flow-autonomous-contract.mjs reels/2026-09-28_bis_2026-10-04/freitag/reel-01_1-prozent-kosten-test
      - name: Validate reel
        run: npm run reel:validate -- reels/2026-09-28_bis_2026-10-04/freitag/reel-01_1-prozent-kosten-test
      - name: TypeScript
        run: npm run typecheck
      - name: Commit migrated rule and reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md scripts/lib/flow-autonomy.mjs scripts/validate-reel-source-contract.mjs scripts/apply-flow-autonomous-contract.mjs reels/2026-09-28_bis_2026-10-04/freitag/reel-01_1-prozent-kosten-test
          git diff --cached --quiet || FINANZNEO_ALLOW_PROTECTED_CHANGES=1 git commit -m "Apply parallel cover V2 workflow to test reel"
          git push origin HEAD:reel/test-free-visual-form-1pct-fees
