name: Future Reel V3 Final Integration Once

on:
  push:
    branches:
      - repo/future-reels-v3-timing-audio-motion
    paths:
      - '.github/workflows/tmp-future-v3-guard.yml'

permissions:
  contents: write

jobs:
  final-integrate-future-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repo/future-reels-v3-timing-audio-motion
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg for Future V3 gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Align canonical docs and cross-platform audio helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: erwartete genau 1 Fundstelle, gefunden {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          claude = 'CLAUDE.md'
          replace_once(
              claude,
              '> Höchste interne Quelle für Reel-Produktion. Bei Widersprüchen mit älteren Dateien gilt immer diese Datei.',
              '> Höchste interne Quelle für Reel-Produktion. Bei Widersprüchen mit älteren Dateien gilt immer diese Datei. Für **neu erzeugte Reels mit `futureProductionStandard.id = finanzneo-future-production-v3`** gelten zusätzlich die strengeren Future-V3-Regeln aus `docs/FUTURE-REEL-PRODUCTION-V3.md`; ältere Reels werden nicht rückwirkend migriert.',
          )
          replace_once(
              claude,
              'VISUAL_BEAT_CONTRACT: finanzneo-visual-beats-v1',
              'VISUAL_BEAT_COMPATIBILITY_BASE: finanzneo-visual-beats-v1\nFUTURE_PRODUCTION_STANDARD: finanzneo-future-production-v3',
          )
          replace_once(
              claude,
              '- statischer Bildbeat ideal ca. 1,8–3,4 s; ohne neue sichtbare Information **max. 4,5 s**',
              '- Kompatibilitätsbasis älterer Reels: statischer Bildbeat ca. 1,8–3,4 s, max. 4,5 s. **Neue Future-V3-Reels:** ideal 1,8–3,0 s; ab ca. 3,6 s aktiv einen zusätzlichen Visual Beat prüfen; ohne neue sichtbare Information **hart max. 4,0 s**',
          )
          replace_once(
              claude,
              '- Animationen müssen visuell dieselbe Qualität und Welt wie die Flow-Bilder erreichen',
              '- Animationen müssen visuell dieselbe Qualität und Welt wie die Flow-Bilder erreichen\n- bei Future-V3-Reels muss die physische Hauptmechanik im echten Render ausreichend groß/füllend sein; Post-Render-QA verlangt Peak-Visualbelegung >= 0,15 und Median >= 0,12 im visuellen Kern',
          )
          replace_once(
              claude,
              '- Audio, Auflösung und Timeline stimmen',
              '- Audio, Auflösung und Timeline stimmen\n- bei Future-V3-Reels wird der Candidate **vor** der Render-QA automatisch auf -16 LUFS / -1 dBTP gemastert und danach real gemessen; bloß vorhandener Audio-Stream reicht nicht',
          )

          standard = 'reels/PRODUKTIONSSTANDARD.md'
          replace_once(
              standard,
              'VISUAL_BEAT_CONTRACT: finanzneo-visual-beats-v1',
              'VISUAL_BEAT_COMPATIBILITY_BASE: finanzneo-visual-beats-v1\nFUTURE_PRODUCTION_STANDARD: finanzneo-future-production-v3',
          )
          replace_once(
              standard,
              '- Statische Bildbeats ideal 1,8–3,4 s und ohne neue sichtbare Information maximal 4,5 s.',
              '- Kompatibilitätsbasis älterer Reels: Bildbeats ideal 1,8–3,4 s und max. 4,5 s. **Neue Future-V3-Reels:** ideal 1,8–3,0 s; ab 3,6 s aktiv Split/zusätzliches Bild prüfen; ohne neue sichtbare Information hart maximal 4,0 s.',
          )
          replace_once(
              standard,
              'Pflicht sind konkrete Realwelt-Objekte, sichtbare Ursache/Wirkung, mehrere koordinierte Motion-Channels und mindestens 15 Frames Ergebnis-Hold. Remotion bleibt Timeline-/Render-Autorität.',
              'Pflicht sind konkrete Realwelt-Objekte, sichtbare Ursache/Wirkung, mehrere koordinierte Motion-Channels und mindestens 15 Frames Ergebnis-Hold. Bei Future-V3-Reels muss die Hauptmechanik zusätzlich im echten Render ausreichend groß/füllend sein (Peak active-pixel ratio >= 0,15, Median >= 0,12). Remotion bleibt Timeline-/Render-Autorität.',
          )
          replace_once(
              standard,
              'FINAL_COMPLETE verlangt: alle Szenen belegt, exakter Animations-Seal, Audio vorhanden, 1080×1920, korrekte Timeline, Visual-QA bestanden und vollständiges `06-export/`.',
              'FINAL_COMPLETE verlangt: alle Szenen belegt, exakter Animations-Seal, Audio vorhanden, 1080×1920, korrekte Timeline, Visual-QA bestanden und vollständiges `06-export/`. Bei Future-V3-Reels kommt vor der Freigabe verpflichtend Audio-Mastering auf -16 LUFS / -1 dBTP plus gemessene Audio-/Animationsbelegungs-QA hinzu.',
          )

          audio_script = 'scripts/normalize-future-reel-audio-v3.mjs'
          replace_once(
              audio_script,
              "import {dirname, resolve} from 'node:path';",
              "import {basename, dirname, resolve} from 'node:path';",
          )
          replace_once(
              audio_script,
              "const tempPath = resolve(dirname(videoPath), `${videoPath.split('/').pop().replace(/\\.mp4$/i, '')}.audio-mastered.mp4`);",
              "const tempPath = resolve(dirname(videoPath), `${basename(videoPath).replace(/\\.mp4$/i, '')}.audio-mastered.mp4`);",
          )
          PY

      - name: Prove existing week reels were not edited
        run: |
          git diff --exit-code origin/reel/mittwoch-geld-am-monatsende -- \
            reels/2026-08-31_bis_2026-09-06/montag \
            reels/2026-08-31_bis_2026-09-06/dienstag \
            reels/2026-08-31_bis_2026-09-06/mittwoch

      - name: Validate Monday backward compatibility
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld

      - name: Validate Tuesday backward compatibility
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus

      - name: Validate Wednesday backward compatibility
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/mittwoch/reel-03_geld-am-monatsende

      - name: Test Future V3 source contract on isolated fixture
        run: |
          FIXTURE="$RUNNER_TEMP/finanzneo-v3-fixture"
          mkdir -p "$FIXTURE/03-szenen" "$FIXTURE/05-projektdateien"
          cat > "$FIXTURE/03-szenen/scene-index.json" <<'JSON'
          {
            "video": {"fps": 30},
            "layout": {"visualTop": 320, "visualBottom": 1400},
            "visualBeatContract": {"id": "finanzneo-visual-beats-v2", "staticImageBeatIdealSeconds": [1.8, 3.2], "staticImageBeatHardMaxSeconds": 4.2},
            "timingStandard": {"imageSceneIdealSeconds": [1.8, 3.2], "imageSceneAbsoluteMaxSeconds": 4.2},
            "audio": {"targetIntegratedLufs": -16, "targetTruePeakDbtp": -1},
            "scenes": [
              {"id": "scene-01", "type": "image", "plannedDurationSeconds": 3.0, "targetSeconds": 3.0},
              {"id": "scene-02", "type": "animation", "startFrame": 0, "durationFrames": 60, "plannedDurationSeconds": 2.0, "targetSeconds": 2.0}
            ]
          }
          JSON
          node scripts/apply-future-production-standard-v3.mjs "$FIXTURE"
          node scripts/validate-future-production-standard-v3.mjs "$FIXTURE"

      - name: Test Future V3 audio mastering and real render occupancy
        run: |
          FIXTURE="$RUNNER_TEMP/finanzneo-v3-fixture"
          VIDEO="$FIXTURE/candidate.mp4"
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "color=c=black:s=1080x1920:r=30:d=2" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=2" \
            -filter_complex "[0:v]drawbox=x=200:y=450:w=680:h=650:color=white:t=fill[v];[1:a]volume=0.03[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 192k "$VIDEO"
          node scripts/normalize-future-reel-audio-v3.mjs "$FIXTURE" "$VIDEO"
          node scripts/validate-future-production-render-v3.mjs "$FIXTURE" "$VIDEO"

      - name: Verify Future V3 is canonical and future-only
        run: |
          grep -F 'FUTURE_PRODUCTION_STANDARD: finanzneo-future-production-v3' CLAUDE.md
          grep -F 'hart max. 4,0 s' CLAUDE.md
          grep -F 'Peak-Visualbelegung >= 0,15' CLAUDE.md
          grep -F -- '-16 LUFS / -1 dBTP' CLAUDE.md
          grep -F 'FUTURE_PRODUCTION_STANDARD: finanzneo-future-production-v3' reels/PRODUKTIONSSTANDARD.md
          grep -F 'hart maximal 4,0 s' reels/PRODUKTIONSSTANDARD.md

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke test
        run: npm run smoke

      - name: Remove one-time integration workflow
        run: rm -f .github/workflows/tmp-future-v3-guard.yml

      - name: Commit fully validated Future V3 integration
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize future reel V3 timing audio and motion gates"
          git push origin HEAD:repo/future-reels-v3-timing-audio-motion
