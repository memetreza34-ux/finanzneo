name: Build Girokonto Tagesgeld Reel Once

on:
  push:
    branches:
      - reel/girokonto-tagesgeld-2026w36
    paths:
      - '.github/workflows/tmp-build-girokonto-reel.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: reel/girokonto-tagesgeld-2026w36
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build final Phase-1 reel
        run: node scripts/tmp-build-girokonto-reel.mjs

      - name: Apply strict contract corrections
        run: node scripts/tmp-fix-girokonto-reel-contract.mjs

      - name: Validate new reel contract
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke test
        run: npm run smoke

      - name: Assert user-owned Phase-2 inputs remain untouched
        run: |
          test -f reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/02-audio/README.md
          test ! -e reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/02-audio/voiceover.mp3
          test -f reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/03-szenen/00-ALLE-BILDER-HIER-REIN/README.md
          test ! -e reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/03-szenen/00-ALLE-BILDER-HIER-REIN/'Bild 01 - Zwei Konten zwei Aufgaben.png'
          test -f reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/04-caption/caption.txt
          test ! -e reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/04-caption/instagram-reels.txt
          test ! -e reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/04-caption/tiktok.txt

      - name: Remove one-time helpers
        run: |
          rm -f scripts/tmp-build-girokonto-reel.mjs
          rm -f scripts/tmp-fix-girokonto-reel-contract.mjs
          rm -f .github/workflows/tmp-build-girokonto-reel.yml

      - name: Commit verified reel
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add next-week Girokonto vs Tagesgeld reel"
          git push origin HEAD:reel/girokonto-tagesgeld-2026w36
