name: Pilot Motion Preview

on:
  pull_request:
    paths:
      - 'reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/**'
      - 'src/motion/**'
      - '.github/workflows/pilot-motion-preview.yml'

permissions:
  contents: read

jobs:
  render-pilot-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Remotion-Browser vorbereiten
        run: npx remotion browser ensure

      - name: Temporären Pilot-Entrypoint erzeugen
        run: |
          cat > pilot-motion-entry.tsx <<'EOF'
          import React from 'react';
          import {AbsoluteFill, Composition, registerRoot} from 'remotion';
          import {Scene03Animation} from './reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/03-szenen/EINZELNE-SZENEN/scene-03/animation';
          import {Scene06Animation} from './reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/03-szenen/EINZELNE-SZENEN/scene-06/animation';
          import {Scene09Animation} from './reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/03-szenen/EINZELNE-SZENEN/scene-09/animation';
          import {Scene10Animation} from './reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld/03-szenen/EINZELNE-SZENEN/scene-10/animation';

          const Frame: React.FC<{children: React.ReactNode}> = ({children}) => (
            <AbsoluteFill style={{backgroundColor: '#000000', overflow: 'hidden'}}>{children}</AbsoluteFill>
          );

          const S03 = () => <Frame><Scene03Animation durationFrames={150} /></Frame>;
          const S06 = () => <Frame><Scene06Animation durationFrames={135} /></Frame>;
          const S09 = () => <Frame><Scene09Animation durationFrames={165} /></Frame>;
          const S10 = () => <Frame><Scene10Animation durationFrames={180} /></Frame>;

          const Root: React.FC = () => <>
            <Composition id="PilotScene03" component={S03} durationInFrames={150} fps={30} width={1080} height={1920} />
            <Composition id="PilotScene06" component={S06} durationInFrames={135} fps={30} width={1080} height={1920} />
            <Composition id="PilotScene09" component={S09} durationInFrames={165} fps={30} width={1080} height={1920} />
            <Composition id="PilotScene10" component={S10} durationInFrames={180} fps={30} width={1080} height={1920} />
          </>;

          registerRoot(Root);
          EOF

      - name: Vier Pilot-Animationen rendern
        run: |
          mkdir -p out/pilot-motion
          npx remotion render pilot-motion-entry.tsx PilotScene03 out/pilot-motion/scene-03.mp4 --codec=h264 --crf=18 --log=warn
          npx remotion render pilot-motion-entry.tsx PilotScene06 out/pilot-motion/scene-06.mp4 --codec=h264 --crf=18 --log=warn
          npx remotion render pilot-motion-entry.tsx PilotScene09 out/pilot-motion/scene-09.mp4 --codec=h264 --crf=18 --log=warn
          npx remotion render pilot-motion-entry.tsx PilotScene10 out/pilot-motion/scene-10.mp4 --codec=h264 --crf=18 --log=warn

      - name: Pilot-Preview hochladen
        uses: actions/upload-artifact@v4
        with:
          name: finanzneo-motion-director-v2-pilot
          path: out/pilot-motion/*.mp4
          if-no-files-found: error
          retention-days: 1
