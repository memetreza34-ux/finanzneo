name: Verify Future Reel Cover Hook V2 Once

on:
  push:
    branches:
      - reel/future-cover-hook-v2
    paths:
      - '.github/workflows/tmp-verify-future-cover-hook-v2.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reel/future-cover-hook-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch future-only cover export
        run: |
          node scripts/tmp-patch-future-cover-export.mjs
          rm scripts/tmp-patch-future-cover-export.mjs
          grep -q "futureCoverHook" scripts/export-reel.mjs
          grep -q "gerenderter finaler Frame 0" scripts/export-reel.mjs

      - name: Prove Monday remains unchanged and valid
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld

      - name: Prove Tuesday V1 remains unchanged and valid
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus

      - name: Create disposable future reel and assert V2 contracts
        run: |
          TEST_REEL='reels/__future-contract-test__/reel-test'
          npm run reel:create -- --target "$TEST_REEL" --title "Warum dein Geld verschwindet" --types image,image,animation,image,image
          node - <<'NODE'
          const fs = require('fs');
          const root = 'reels/__future-contract-test__/reel-test';
          const x = JSON.parse(fs.readFileSync(root + '/03-szenen/scene-index.json', 'utf8'));
          const req = (v, m) => { if (!v) throw new Error(m); };
          req(x.visualBeatContract?.id === 'finanzneo-visual-beats-v2', 'Visual Beats V2 missing');
          req(x.imageStorytellingContract?.id === 'finanzneo-image-storytelling-v2', 'Image Storytelling V2 missing');
          req(x.coverHookContract?.id === 'finanzneo-cover-hook-v2', 'Cover Hook V2 missing');
          req(x.coverHookContract?.titleVisibleFromFrame === 0, 'Cover title not frame 0');
          req(x.coverHookContract?.subtitlesForbiddenDuringScene01 === true, 'Scene01 subtitle lock missing');
          req(x.coverHookContract?.exportedCoverSource === 'final-video-frame-0', 'Rendered cover export missing');
          req(x.scenes?.[0]?.captionEnabled === false, 'Scene01 captionEnabled must be false');
          req(x.scenes?.[0]?.subtitleMode === 'off', 'Scene01 subtitleMode must be off');
          req(x.scenes?.[0]?.coverTitle === x.title, 'Scene01 exact title mismatch');
          const handoff = fs.readFileSync(root + '/05-projektdateien/ANTIGRAVITY-AUFTRAG.md', 'utf8');
          req(handoff.includes('KEINE Caption-/Subtitle-Komponente'), 'Render-side caption lock missing');
          req(handoff.includes('Frame 0'), 'Frame0 render instruction missing');
          const coverPrompt = fs.readFileSync(root + '/03-szenen/00-cover/cover.txt', 'utf8');
          req(coverPrompt.includes('FUTURE_COVER_HOOK: finanzneo-cover-hook-v2'), 'Cover prompt marker missing');
          req(coverPrompt.includes('KEINEN Reel-Titel'), 'Generated title must be forbidden');
          req(coverPrompt.includes('IMAGE_STORYTELLING_CONTRACT: finanzneo-image-storytelling-v2'), 'Image storytelling marker missing');
          console.log('✓ Disposable future reel has Cover Hook V2 + Visual Beats V2 + Image Storytelling V2.');
          NODE
          node scripts/validate-future-cover-hook-v2.mjs "$TEST_REEL"
          node scripts/validate-future-image-storytelling-v2.mjs "$TEST_REEL"
          rm -rf reels/__future-contract-test__

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke test
        run: npm run smoke

      - name: Ensure no backward reel mutation
        run: |
          git diff --exit-code f82e51e453b015fed29a98fba76a95751930be67 -- reels/2026-08-31_bis_2026-09-06/montag reels/2026-08-31_bis_2026-09-06/dienstag

      - name: Remove one-time workflow
        run: rm -f .github/workflows/tmp-verify-future-cover-hook-v2.yml

      - name: Commit only after every guard passed
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add future-only reel cover hook and visual storytelling v2"
          git push origin HEAD:reel/future-cover-hook-v2

# retry: 3
