name: Generate Notgroschen Test Reel

on:
  push:
    branches:
      - reel/notgroschen-test-v1

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[reel-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: reel/notgroschen-test-v1
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reel erzeugen
        run: |
          node scripts/tmp-generate-notgroschen-reel.mjs
          node scripts/tmp-fix-notgroschen-structure.mjs

      - name: Reel vollständig validieren
        run: npm run reel:validate -- reels/2026-08-24_bis_2026-08-30/freitag/reel-02_notgroschen-richtig-aufbauen

      - name: Fertiges Reel committen und Bootstrap entfernen
        run: |
          rm -f scripts/tmp-generate-notgroschen-reel.mjs
          rm -f scripts/tmp-fix-notgroschen-structure.mjs
          rm -f .github/workflows/tmp-generate-notgroschen-reel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Notgroschen test reel [reel-generated]"
          git push origin HEAD:reel/notgroschen-test-v1
