name: YouTube Light Motion Showcase V2

on:
  push:
    branches:
      - reset-image-prompt-rules
    paths:
      - 'src/youtube-motion/showcase-v2/**'
      - 'src/root/ExperimentCompositions.tsx'
      - 'package.json'
      - '.github/workflows/youtube-light-motion-showcase-v2.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Render light showcase
        run: npm run render:youtube-light-motion-showcase

      - name: Upload light showcase
        uses: actions/upload-artifact@v4
        with:
          name: youtube-light-motion-showcase-v2
          path: out/youtube-light-motion-showcase-v2.mp4
          if-no-files-found: error
          retention-days: 7
