name: Build Wednesday Beginner Reel Once

on:
  push:
    branches:
      - reel/mittwoch-geld-am-monatsende
    paths:
      - '.github/workflows/tmp-build-wednesday-reel.yml'

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reel/mittwoch-geld-am-monatsende
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Wednesday reel and finish Future V2 integration
        run: node scripts/tmp-build-wednesday-reel.mjs

      - name: Fill final V2 validation markers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const root = 'reels/2026-08-31_bis_2026-09-06/mittwoch/reel-03_geld-am-monatsende';
          const indexPath = `${root}/03-szenen/scene-index.json`;
          const x = JSON.parse(fs.readFileSync(indexPath,'utf8'));
          const intents = {
            'scene-03':'Ein sichtbarer Gehaltsstapel bewegt sich zum Girokonto und setzt den echten Monatsbetrag auf 2.400 €.',
            'scene-06':'Ein Monatsbudget von 800 € teilt sich physisch in vier gleich große Wochenstapel zu je 200 €.',
            'scene-09':'Vier kleine Käufe ziehen nacheinander Geld aus dem Konto und addieren sich sichtbar zu 44 € Monatskosten.',
          };
          x.scenes = x.scenes.map((s)=>intents[s.id] ? {...s,animationIntent:intents[s.id]} : s);
          fs.writeFileSync(indexPath, JSON.stringify(x,null,2)+'\n');

          const beatsPath = `${root}/05-projektdateien/visual-beats.md`;
          let beats = fs.readFileSync(beatsPath,'utf8');
          const beatRule = 'Lieber ein zusätzliches gutes Bild planen als einen neuen konkreten Gedanken in ein überladenes Stillbild zu pressen.';
          if (!beats.includes('Lieber ein zusätzliches gutes Bild')) beats = beats.replace('VISUAL_BEAT_CONTRACT: finanzneo-visual-beats-v2\n', `VISUAL_BEAT_CONTRACT: finanzneo-visual-beats-v2\n\n${beatRule}\n`);
          fs.writeFileSync(beatsPath, beats, 'utf8');
          NODE

      - name: Build compact individual V9 image prompts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const root = 'reels/2026-08-31_bis_2026-09-06/mittwoch/reel-03_geld-am-monatsende';
          const index = JSON.parse(fs.readFileSync(`${root}/03-szenen/scene-index.json`,'utf8'));
          const compactPrompt = (scene, isCover=false) => {
            const labels = Array.isArray(scene.objectLabels) ? scene.objectLabels : [];
            const labelLines = labels.length ? labels.map((x)=>`- ${x}`).join('\n') : '- none';
            const coverRules = isCover ? `\nFUTURE_COVER_HOOK: finanzneo-cover-hook-v2\nThe Flow image itself contains KEINEN Reel-Titel, no headline, no subtitle and no CTA. Reserve calm deep-black negative space in the upper area for the exact Remotion reel title. The title is rendered later from frame 0.\n` : '';
            return `FLOW_AGENT_PROTOCOL: finanzneo-flow-sequential-v1
FLOW_EXECUTION_MODE: finanzneo-flow-strict-single-job-v3
GOOGLE FLOW – FINALER DATEINAME:
${scene.googleFlowFileName}

BESCHRIFTUNGEN – EXAKT SO:
${labelLines}

IMAGE PROMPT:
Create one polished stylized 3D animated finance-explainer image for this exact spoken beat. ${scene.expectedVisual} The visible story must specifically communicate this action or consequence: ${scene.mainIdea} Ground the composition in a believable everyday situation with recognizable real-world objects, clear physical relationships and a strong focal point. Make the cause-and-effect readable immediately without narration: the viewer should clearly understand what is happening and why within one second. Use depth, scale, contact shadows and restrained cinematic lighting to make the scene feel tangible and premium. Supporting objects are allowed only when they improve the explanation. Keep all requested German object labels short, legible and naturally attached to their objects; do not add any other explanatory text. Avoid a static catalog arrangement: show a moment, action, contrast or consequence that feels like a real situation.

FINANZNEO_WORLD_ID: finanzneo-connected-studio-v3
FINANZNEO_SERIES_LOCK: finanzneo-same-world-v1
GENERATED_IMAGE_ASPECT_RATIO: 1:1
PREMIUM_VISUAL_WORLD_LOCK: finanzneo-stylized-3d-animated-black-v9
IMAGE_STORYTELLING_CONTRACT: finanzneo-image-storytelling-v2
${coverRules}
STYLE + SAFETY:
Use stylized 3D animated geometry, simplified premium materials and a seamless deep black background. Keep the scene real-world-grounded and non-photorealistic. Soft contact shadows and clean subject-separation lighting are required. No photorealism, product-photo look, dashboard, app UI, flowchart, floating UI tiles, microchip/circuit language, miniature diorama or decorative clutter. Keine stumpfen Symbolbilder als Haupterklärung. Bevorzuge Ursache → Wirkung, Handlung → Konsequenz oder klaren Vorher/Nachher-Kontrast. Wenn ein neuer konkreter Gedanke mehr Platz braucht, lieber ein zusätzliches Bild planen statt dieses Motiv zu überladen.
`;
          };

          const masterHeader = [
            'FLOW_AGENT_PROTOCOL: finanzneo-flow-sequential-v1',
            'FLOW_EXECUTION_MODE: finanzneo-flow-strict-single-job-v3',
            'FLOW_STATE_MACHINE: finanzneo-flow-state-machine-v1',
            'MAX_CONCURRENT_GENERATIONS = 1',
            'FINAL_IMAGE_DIRECTORY: 03-szenen/00-ALLE-BILDER-HIER-REIN/',
            'COVER = SZENE 01',
            'KEIN separates Cover erzeugen',
            'KEIN Bild 00 erzeugen',
            '',
            'Arbeite strikt Bild für Bild. Erst Ergebnis zurückbekommen, exakt umbenennen und QA prüfen; danach den nächsten Bildjob starten.',
            '',
          ].join('\n');

          const blocks = [];
          for (const scene of index.scenes.filter((s)=>s.type==='image')) {
            const relative = String(scene.planFile).replace(/^03-szenen\//,'');
            const path = `${root}/03-szenen/${relative}`;
            const prompt = compactPrompt(scene, scene.id === 'scene-01');
            if (prompt.length > 4200) throw new Error(`${scene.id} compact prompt too long: ${prompt.length}`);
            fs.writeFileSync(path, prompt, 'utf8');
            blocks.push(`## ${scene.id}\n\n${prompt}`);
          }
          fs.writeFileSync(`${root}/03-szenen/alle-bildprompts.txt`, masterHeader + blocks.join('\n\n---\n\n') + '\n', 'utf8');

          const first = index.scenes[0];
          let cover = compactPrompt(first, true);
          cover += '\nCOVER = SZENE 01\nKEIN SEPARATER BILDJOB\nNo separate cover generation\nno Bild 00\nTechnischer Alias: Dieses Dokument beschreibt exakt scene-01 und startet keinen zusätzlichen Google-Flow-Job.\n';
          if (cover.length > 4200) throw new Error(`cover compact prompt too long: ${cover.length}`);
          fs.writeFileSync(`${root}/03-szenen/00-cover/cover.txt`, cover, 'utf8');
          NODE

      - name: Normalize unique scene icons
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'reels/2026-08-31_bis_2026-09-06/mittwoch/reel-03_geld-am-monatsende/03-szenen/scene-index.json';
          const x = JSON.parse(fs.readFileSync(p,'utf8'));
          const icons = ['wallet','search','euro','receipt','coins','calendar','list','phone','trending','target','check'];
          x.scenes = x.scenes.map((s,i)=>({...s,icon:icons[i]}));
          fs.writeFileSync(p, JSON.stringify(x,null,2)+'\n');
          for (let i=0;i<x.scenes.length;i++) {
            const id = `scene-${String(i+1).padStart(2,'0')}`;
            const f = `reels/2026-08-31_bis_2026-09-06/mittwoch/reel-03_geld-am-monatsende/03-szenen/EINZELNE-SZENEN/${id}/szene.md`;
            let t = fs.readFileSync(f,'utf8');
            t = t.replace(/^\*\*Icon:\*\* .*$/m, `**Icon:** ${icons[i]}`);
            fs.writeFileSync(f,t);
          }
          NODE

      - name: Validate Monday unchanged behavior
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/montag/reel-01_girokonto-oder-tagesgeld

      - name: Validate Tuesday unchanged behavior
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/dienstag/reel-02_konto-im-minus

      - name: Validate Wednesday V2 reel
        run: npm run reel:validate -- reels/2026-08-31_bis_2026-09-06/mittwoch/reel-03_geld-am-monatsende

      - name: Full repository validation
        run: npm run validate

      - name: Remotion bundle
        run: npm run build

      - name: Render smoke test
        run: npm run smoke

      - name: Prove Monday and Tuesday were not edited
        run: git diff --exit-code ea9828fc6a4159d30ca6addff02e8010fb832c5f -- reels/2026-08-31_bis_2026-09-06/montag reels/2026-08-31_bis_2026-09-06/dienstag

      - name: Remove one-time build files
        run: |
          rm -f .github/workflows/tmp-build-wednesday-reel.yml
          rm -f scripts/tmp-build-wednesday-reel.mjs

      - name: Commit validated Wednesday reel
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Wednesday beginner reel with Future V2"
          git push origin HEAD:reel/mittwoch-geld-am-monatsende
