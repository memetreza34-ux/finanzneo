name: Apply Flow Cover 5Pack Once

# rerun after preserving scene-01 cover alias markers
on:
  push:
    branches:
      - reel/test-free-visual-form-1pct-fees
    paths:
      - .github/workflows/apply-flow-cover-5pack-once.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: reel/test-free-visual-form-1pct-fees
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply cover anchor 5-pack Flow contract
        run: node scripts/apply-flow-autonomous-contract.mjs reels/2026-09-28_bis_2026-10-04/freitag/reel-01_1-prozent-kosten-test
      - name: Validate reel
        run: npm run reel:validate -- reels/2026-09-28_bis_2026-10-04/freitag/reel-01_1-prozent-kosten-test
      - name: TypeScript
        run: npm run typecheck
      - name: Commit migrated reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/2026-09-28_bis_2026-10-04/freitag/reel-01_1-prozent-kosten-test
          git diff --cached --quiet || git commit -m "Apply three-cover 5-pack Flow contract to test reel"
          git push origin HEAD:reel/test-free-visual-form-1pct-fees
