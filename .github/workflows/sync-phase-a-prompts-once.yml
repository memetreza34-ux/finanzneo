name: Sync Phase A Flow Master Once

on:
  pull_request:
    paths:
      - '.github/workflows/sync-phase-a-prompts-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-fees-30-years-phase1-custom
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate current Flow master from Phase-A prompts
        run: node scripts/apply-flow-five-pack-reference-v1.mjs reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren
      - name: Validate current Flow master
        run: node scripts/validate-central-flow-prompts.mjs reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren
      - name: Commit regenerated handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren/03-szenen/alle-bildprompts.txt
          git add reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren/03-szenen/scene-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Phase-A Flow master"
          git push origin HEAD:reel-fees-30-years-phase1-custom
