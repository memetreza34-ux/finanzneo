name: One-shot reseal restored Flow routing

on:
  push:
    branches:
      - youtube/v4-kreditkarten-teilzahlung
    paths:
      - .github/workflows/one-shot-reseal-credit-card-v4.yml

permissions:
  contents: write

jobs:
  verify-and-reseal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: youtube/v4-kreditkarten-teilzahlung
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate YouTube project
        run: npm run youtube:validate -- youtube/2026-10-03_kreditkarten-teilzahlung

      - name: Validate Motion V3
        run: npm run youtube:animation:validate -- youtube/2026-10-03_kreditkarten-teilzahlung

      - name: Reseal Phase 1 animations
        run: npm run youtube:phase1:seal -- youtube/2026-10-03_kreditkarten-teilzahlung

      - name: Commit refreshed animation seal
        env:
          FINANZNEO_ALLOW_PROTECTED_CHANGES: '1'
        run: |
          if git diff --quiet -- youtube/2026-10-03_kreditkarten-teilzahlung/06-projektdateien/animation-seal.json; then
            echo "Seal already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube/2026-10-03_kreditkarten-teilzahlung/06-projektdateien/animation-seal.json
          git commit -m "chore: reseal restored Flow image routing"
          git push origin HEAD:youtube/v4-kreditkarten-teilzahlung
