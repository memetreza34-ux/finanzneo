name: Finance Animation Runner Diagnostic

on:
  pull_request:
    paths:
      - 'channels/finanzneo/src/animation-system/**'
      - '.github/workflows/finance-animation-runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-runner-start:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner started
        shell: bash
        run: |
          echo "GitHub-hosted runner started successfully."
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          uname -a
