name: Validate Flow 5Pack Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/validate-flow-5pack-diagnostic.yml'
      - 'scripts/apply-flow-five-pack-reference-v1.mjs'
      - 'scripts/create-finanzneo-reel.mjs'
      - 'scripts/validate-central-flow-prompts.mjs'
      - 'scripts/validate-flow-autonomous-contract.mjs'
      - 'scripts/lib/flow-autonomy.mjs'
      - 'tests/central-flow-prompts.test.ts'
      - 'tests/flow-single-job.test.ts'
      - '.agents/rules/google-flow-5pack-cover-reference-v1.md'
      - 'reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren/**'

permissions:
  contents: read

jobs:
  validate-flow-5pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Validate current Flow handoff
        run: node scripts/validate-central-flow-prompts.mjs reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren
      - name: TypeScript
        run: npm run typecheck
