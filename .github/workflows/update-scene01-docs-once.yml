name: Update Scene01 Docs Once

on:
  push:
    branches:
      - reel/notgroschen-test-v1
    paths:
      - '.github/workflows/update-scene01-docs-once.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel/notgroschen-test-v1
          fetch-depth: 0

      - name: Update canonical agent documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          claude = Path('CLAUDE.md')
          text = claude.read_text()
          replacements = [
              (
                  '- erzeugt Cover + Szenenbilder mit Google Flow',
                  '- erzeugt die Szenenbilder mit Google Flow; **scene-01 ist automatisch das Cover**, kein separater Cover-Bildjob und kein Bild 00',
              ),
              (
                  '## 4. Reel-Struktur\n\n```text',
                  '## 4. Reel-Struktur\n\n**Cover-Regel:** `scene-01` ist immer eine Bildszene und automatisch das Cover. Es wird kein separates Cover und kein `Bild 00` erzeugt. `03-szenen/00-cover/cover.txt` ist nur ein technischer Alias/Vertrag auf das Bild von `scene-01`.\n\n```text',
              ),
              (
                  '→ Final MP4\n→ reel:export\n→ FINAL_COMPLETE',
                  '→ Final MP4\n→ automatischer reel:export nach 06-export/\n→ FINAL_COMPLETE',
              ),
              (
                  '## 14. Publishing\n\nReel-Plattformdateien:',
                  '## 14. Publishing\n\nStandard für alle Reel-Plattformen ist die **universelle Caption**: `04-caption/caption.txt` wird beim finalen Export automatisch als `06-export/caption-universal.txt` ausgegeben. Instagram Reels, TikTok, Facebook Reels und Snapchat verwenden standardmäßig diese Datei; Plattformvarianten bleiben optionale Zusatzdateien.\n\nReel-Plattformdateien:',
              ),
              (
                  '## 15. Produktionsbefehle\n\n```bash',
                  '## 15. Produktionsbefehle\n\nIm normalen Phase-3-Lauf wird `reel:export` nach bestandener Render-QA automatisch von `render-validated.mjs` gestartet. Der direkte Befehl bleibt nur für einen kontrollierten erneuten Export vorhanden.\n\n```bash',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'CLAUDE.md Marker fehlt: {old!r}')
              text = text.replace(old, new, 1)
          claude.write_text(text)

          brief = Path('docs/PHASE-1-BRIEFING.md')
          text = brief.read_text()
          replacements = [
              (
                  '- Flow-Quellbilder inklusive Cover strikt 1:1',
                  '- alle Flow-Bildszenen strikt 1:1; scene-01 ist automatisch das Cover, kein separates Cover und kein Bild 00',
              ),
              (
                  '- cover.txt',
                  '- 00-cover/cover.txt nur als technischer Alias auf scene-01; kein separater Cover-Prompt und kein zusätzlicher Bildjob',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'PHASE-1-BRIEFING Marker fehlt: {old!r}')
              text = text.replace(old, new, 1)
          brief.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-scene01-docs-once.yml
          git add CLAUDE.md docs/PHASE-1-BRIEFING.md
          git commit -m "Document scene 01 cover and automatic reel export"
          git push origin HEAD:reel/notgroschen-test-v1
