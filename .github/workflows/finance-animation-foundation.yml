name: Finance Animation Foundation

on:
  pull_request:
    paths:
      - 'channels/finanzneo/src/animation-system/**'
      - 'channels/finanzneo/tsconfig.animation-system.json'
      - 'scripts/verify-finance-animation-foundation.mjs'
      - 'scripts/verify-finance-animation-data-contracts.mjs'
      - 'scripts/verify-finance-animation-activation-policy.mjs'
      - 'scripts/verify-finance-animation-frame-matrix.mjs'
      - 'scripts/verify-finance-animation-isolation.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finance-animation-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-animation-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-animation-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify structure, exact data contracts and activation policy
        run: npm run finance:animation-structure

      - name: Verify production isolation and disabled flags
        run: npm run finance:animation-isolation

      - name: Install dependencies
        run: npm ci

      - name: Typecheck animation foundation
        run: npm run finance:animation-typecheck

      - name: Run animation foundation tests
        run: npm run finance:animation-test

      - name: Render animation gallery contact sheet
        run: npm run finance:animation-gallery:still

      - name: Render sequential animation gallery still
        run: npm run finance:animation-gallery:sequence-still

      - name: Render start-middle-end QA matrix
        run: npm run finance:animation-gallery:matrix-still

      - name: Render safe fallback preview
        run: npm run finance:animation-test-reel:still

      - name: Upload animation previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-animation-previews
          path: |
            /tmp/finance-animation-gallery.png
            /tmp/finance-animation-gallery-sequence.png
            /tmp/finance-animation-frame-matrix.png
            /tmp/finance-animation-fallback-preview.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify productive renderer stayed untouched in the PR diff
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="origin/main"
          fi
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            channels/finanzneo/src/engine/FinanceProductionLayer.tsx \
            channels/finanzneo/src/engine/FinanceImageFirstReel.tsx \
            channels/finanzneo/src/FinanzNeoRoot.tsx
