name: Finance Animation Foundation

on:
  pull_request:
    paths:
      - 'channels/finanzneo/src/animation-system/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finance-animation-foundation.yml'
  workflow_dispatch:

jobs:
  validate-animation-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck animation foundation
        run: npx tsc --noEmit -p channels/finanzneo/tsconfig.json

      - name: Run animation foundation tests
        run: npx vitest run channels/finanzneo/src/animation-system

      - name: Render isolated animation gallery still
        run: npm run finance:animation-gallery:still

      - name: Upload gallery preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-animation-gallery-preview
          path: /tmp/finance-animation-gallery.png
          if-no-files-found: warn

      - name: Verify productive renderer stayed untouched
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="origin/main"
          fi
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            channels/finanzneo/src/engine/FinanceProductionLayer.tsx \
            channels/finanzneo/src/engine/FinanceImageFirstReel.tsx \
            channels/finanzneo/src/FinanzNeoRoot.tsx
