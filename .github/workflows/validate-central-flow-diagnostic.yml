name: Validate Central Flow Handoff Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/validate-central-flow-diagnostic.yml'
      - 'scripts/validate-central-flow-prompts.mjs'
      - 'scripts/validate-reel.mjs'
      - 'scripts/scaffold-finanzneo-reel.mjs'
      - 'tests/central-flow-prompts.test.ts'
      - 'reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren/**'

permissions:
  contents: read

jobs:
  validate-flow-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Validate current one-minute reel
        run: npm run reel:validate -- reels/2026-09-28_bis_2026-10-04/dienstag/reel-01_1-prozent-gebuehren
      - name: TypeScript
        run: npm run typecheck
